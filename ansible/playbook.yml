---
- name: Konfigurasi ec2-database
  hosts: db_servers
  become: true
  vars:
    db_name: kasrw
    db_user: kasrw_user
    db_password: "password123"
    db_host: "172.31.31.15"
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
    - name: Install MySQL server
      ansible.builtin.apt:
        name: mysql-server
        state: present
    - name: Install python3-pymysql
      ansible.builtin.apt:
        name: python3-pymysql
        state: present
    - name: Pastikan MySQL berjalan
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true
    - name: Buat database kasrw
      community.mysql.mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
    - name: Buat user MySQL untuk backend
      community.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL"
        host: "{{ db_host }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
    - name: Set bind-address
      ansible.builtin.lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
        backup: true
    - name: Restart MySQL
      ansible.builtin.service:
        name: mysql
        state: restarted

- name: Konfigurasi ec2-backend
  hosts: backend_servers
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
    - name: Install Python dan dependencies
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - mysql-client
        state: present
    - name: Install pip packages
      ansible.builtin.pip:
        name:
          - fastapi
          - uvicorn
          - mysql-connector-python
          - python-dotenv
        extra_args: --break-system-packages
        state: present

- name: Konfigurasi ec2-frontend
  hosts: frontend_servers
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
    - name: Pastikan Nginx berjalan
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
    - name: Buat halaman HTML
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Aplikasi Pencatatan Kas RW</h1><p>Frontend berhasil dideploy via Ansible.</p>"
        mode: '0644'